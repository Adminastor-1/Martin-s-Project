<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retro İndirme Merkezi - Windows 95</title>
  <!-- Windows 98/95 CSS Framework -->
  <link rel="stylesheet" href="https://unpkg.com/98.css">
  <style>
    /* Windows 95 İmleç Stili */
    * {
      cursor: url('https://cur.cursors-4u.net/computers/com-1/com032.cur'), auto !important;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #008080; /* Win95 Klasik Masaüstü Yeşili */
      font-family: "Pixelated MS Sans Serif", "MS Sans Serif", Tahoma, sans-serif;
      overflow: hidden;
      user-select: none;
    }

    /* Ana Ekran Düzeni */
    .desktop {
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 4px;
      padding-bottom: 38px; /* Taskbar boşluğu */
    }

    /* Tam Ekran Pencere */
    .main-window {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .window-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 8px;
      margin: 0;
      overflow: hidden;
    }

    /* Sol ve Sağ Panelleri Ayıran Esnek Düzen */
    .app-layout {
      display: flex;
      flex: 1;
      gap: 10px;
      height: 100%;
      margin-top: 8px;
    }

    /* Sol Panel (Kategoriler) */
    .sidebar {
      width: 220px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 10px;
      background: #c0c0c0;
    }

    .category-btn {
      width: 100%;
      padding: 12px;
      text-align: left;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
    }

    .category-btn.active {
      font-weight: bold;
      background-color: #000080;
      color: white;
    }

    /* Sağ Panel (İçerik/Butonlar) */
    .content-area {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      background: #c0c0c0;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 12px;
      margin-top: 10px;
    }

    .app-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 15px;
      height: 90px;
      text-align: center;
      font-size: 12px;
    }

    .app-btn span {
      margin-top: 8px;
    }

    /* Özel Sağ Tık Menüsü */
    #custom-context-menu {
      display: none;
      position: absolute;
      z-index: 10000;
      width: 160px;
    }

    #custom-context-menu ul {
      list-style: none;
      margin: 0;
      padding: 2px;
    }

    #custom-context-menu li {
      padding: 4px 10px;
      font-size: 12px;
    }

    #custom-context-menu li:hover {
      background-color: #000080;
      color: white;
    }

    /* Modal / Kurulum Penceresi */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      z-index: 9000;
      justify-content: center;
      align-items: center;
    }

    .modal-window {
      width: 450px;
      max-width: 90%;
    }

    /* Alt Görev Çubuğu (Taskbar) */
    .taskbar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 35px;
      background: #c0c0c0;
      border-top: 2px solid #ffffff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 2px 5px;
      z-index: 8000;
    }

    .start-btn {
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 5px;
      height: 28px;
    }

    .time-box {
      border: 2px inset #ffffff;
      padding: 2px 8px;
      font-size: 11px;
      background: #c0c0c0;
    }
  </style>
</head>
<body>

  <div class="desktop">
    <!-- Tam Ekran Windows Penceresi -->
    <div class="window main-window">
      <div class="title-bar">
        <div class="title-bar-text">💾 Retro_Indirme_Merkezi.exe - [Tam Ekran]</div>
        <div class="title-bar-controls">
          <button aria-label="Minimize"></button>
          <button aria-label="Maximize"></button>
          <button aria-label="Close"></button>
        </div>
      </div>
      
      <div class="window-body">
        <p style="margin: 4px 0;">Sol menüden bir işletim sistemi seçin ve indirmek istediğiniz yazılıma tıklayın.</p>
        
        <div class="app-layout">
          <!-- Sol Kısım: Seçenekler -->
          <fieldset class="sidebar">
            <legend>Sistemler</legend>
            <button class="category-btn active" id="btn-win" onclick="showCategory('win')">
              💻 Windows
            </button>
            <button class="category-btn" id="btn-linux" onclick="showCategory('linux')">
              🐧 Linux
            </button>
          </fieldset>

          <!-- Sağ Kısım: İndirme Butonları -->
          <fieldset class="content-area">
            <legend id="section-title">💻 Windows Yazılımları (10 Program)</legend>
            <div class="grid-container" id="app-grid"></div>
          </fieldset>
        </div>
      </div>
    </div>
  </div>

  <!-- Kurulum Açıklama Penceresi (Modal) -->
  <div class="modal-overlay" id="info-modal">
    <div class="window modal-window">
      <div class="title-bar">
        <div class="title-bar-text" id="modal-title">Program Detayı</div>
        <div class="title-bar-controls">
          <button aria-label="Close" onclick="closeModal()"></button>
        </div>
      </div>
      <div class="window-body">
        <p id="modal-desc" style="white-space: pre-line; line-height: 1.4;">Kurulum bilgisi bekleniyor...</p>
        <div class="field-row" style="justify-content: flex-end; margin-top: 20px; gap: 8px;">
          <button onclick="alert('İndirme Başlatılıyor...')">💾 İndirmeyi Başlat</button>
          <button onclick="closeModal()">Kapat</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Win95 Sağ Tık Menüsü -->
  <div id="custom-context-menu" class="window">
    <div class="window-body" style="padding: 2px;">
      <ul>
        <li onclick="alert('Sistem: Windows 95 OSR2\nRAM: 32 MB\nEkran: Tam Ekran Modu')">🖥️ Özellikler</li>
        <li onclick="location.reload()">🔄 Yenile</li>
        <hr>
        <li onclick="alert('Tüm indirmeler güvenlidir.')">🛡️ Güvenlik Bilgisi</li>
        <li onclick="alert('Retro Download Hub v2.0')">ℹ️ Hakkında</li>
      </ul>
    </div>
  </div>

  <!-- Taskbar -->
  <div class="taskbar">
    <button class="start-btn" onclick="alert('Windows 95 Başlat Menüsü')">
      <b>Başlat</b>
    </button>
    <div class="time-box" id="clock">12:00 PM</div>
  </div>

  <script>
    // Windows Programları Listesi (10 Tane)
    const winApps = [
      { name: "WinRAR 3.0", setup: "1. setup.exe dosyasını indirin.\n2. Çalıştırıp varsayılan konuma yükleyin.\n3. Arşiv dosyalarınızı çift tıklayarak açabilirsiniz." },
      { name: "Winamp 2.91", setup: "1. Kurulumu tamamlayın.\n2. Sevdiğiniz EQ ayarını yapın.\n3. MP3 listenizi sürükleyip bırakın." },
      { name: "mIRC v6.0", setup: "1. Programı kurun.\n2. Sunucu listesinden 'IRCnet' veya 'DALnet' seçin.\n3. Rumuz yazıp bağlanın." },
      { name: "Nero Burning ROM", setup: "1. Kurulumu yapın.\n2. Veri CD'si veya Müzik CD'si seçeneğini tıklayın.\n3. Yazdır butonuna basın." },
      { name: "CCleaner Classic", setup: "1. Yükleyin ve çalıştırın.\n2. 'Analiz Et' butonuna tıklayıp gereksiz dosyaları temizleyin." },
      { name: "Daemon Tools 3.47", setup: "1. Kurulum tamamlandıktan sonra bilgisayarı yeniden başlatın.\n2. Sağ alttaki simgeden ISO dosyanızı seçin." },
      { name: "MSN Messenger 4.7", setup: "1. Yükleme sihirbazını izleyin.\n2. Oturum açma bilgilerinizi girip arkadaşlarınızı ekleyin." },
      { name: "K-Lite Codec Pack", setup: "1. Standart kurulumu tercih edin.\n2. Artık tüm video formatlarını Media Player'da oynatabilirsiniz." },
      { name: "Total Commander", setup: "1. Çift panelli dosya yöneticisini kurun.\n2. Dosyaları kopyalamak için F5, taşımak için F6 kullanın." },
      { name: "BS.Player Old", setup: "1. İndirip kurun.\n2. Film dosyalarınızı altyazılarıyla sorunsuz izleyin." }
    ];

    // Linux Programları Listesi (10 Tane)
    const linuxApps = [
      { name: "XMMS Player", setup: "1. Terminali açın.\n2. 'sudo apt install xmms' komutunu çalıştırın.\n3. Müziklerinizi oynatmaya başlayın." },
      { name: "XChat IRC", setup: "1. Paketi indirin ve 'sudo dpkg -i xchat.deb' yazın.\n2. Grafik arayüzden kanal seçip sohbete katılın." },
      { name: "GIMP 1.2 Retro", setup: "1. Paket yöneticinizden GIMP'i seçin ve yükleyin.\n2. Terminale 'gimp' yazarak çalıştırın." },
      { name: "Wine 1.0", setup: "1. Terminale 'sudo apt install wine' yazın.\n2. Windows .exe dosyalarına sağ tıklayıp Wine ile çalıştırın." },
      { name: "Midnight Commander", setup: "1. Terminalde 'sudo apt install mc' yazın.\n2. Çalıştırmak için konsola 'mc' yazın." },
      { name: "MPlayer CLI", setup: "1. Terminale 'sudo apt install mplayer' yazın.\n2. 'mplayer video.avi' yazarak izleyin." },
      { name: "Fluxbox Window Mgr", setup: "1. Minimalist pencere yöneticisini kurun.\n2. Oturum kapatıp giriş ekranından Fluxbox'ı seçin." },
      { name: "HTOP Sys Monitor", setup: "1. 'sudo apt install htop' yazın.\n2. Terminalde işlemci ve RAM kullanımını renkli grafiklerle takip edin." },
      { name: "Xterm Retro", setup: "1. Klasik X11 terminal uygulamasını kurun.\n2. '~/.Xresources' üzerinden renk yapılandırması yapabilirsiniz." },
      { name: "Apache Web Server", setup: "1. 'sudo apt install apache2' komutuyla kurun.\n2. Web dosyalarınızı '/var/www/html' içine koyun." }
    ];

    let currentCategory = 'win';

    // Ekranı Güncelleme Fonksiyonu
    function renderApps() {
      const grid = document.getElementById("app-grid");
      const title = document.getElementById("section-title");
      grid.innerHTML = "";

      const apps = currentCategory === 'win' ? winApps : linuxApps;
      const icon = currentCategory === 'win' ? "💽" : "🐧";

      title.innerText = currentCategory === 'win' 
        ? "💻 Windows Yazılımları (10 Program)" 
        : "🐧 Linux Yazılımları (10 Program)";

      apps.forEach(app => {
        const btn = document.createElement("button");
        btn.className = "app-btn";
        btn.innerHTML = `<span style="font-size:20px;">${icon}</span><span>${app.name}</span>`;
        btn.onclick = () => openModal(app.name, app.setup);
        grid.appendChild(btn);
      });
    }

    // Sol Menü Tıklama Değişimi
    function showCategory(cat) {
      currentCategory = cat;
      document.getElementById("btn-win").classList.toggle("active", cat === 'win');
      document.getElementById("btn-linux").classList.toggle("active", cat === 'linux');
      renderApps();
    }

    // Modal Aç/Kapat
    function openModal(title, setupInfo) {
      document.getElementById("modal-title").innerText = title + " - Kurulum Rehberi";
      document.getElementById("modal-desc").innerText = setupInfo;
      document.getElementById("info-modal").style.display = "flex";
    }

    function closeModal() {
      document.getElementById("info-modal").style.display = "none";
    }

    // Windows 95 Özel Sağ Tık Menüsü
    const contextMenu = document.getElementById("custom-context-menu");

    window.addEventListener("contextmenu", (e) => {
      e.preventDefault();
      contextMenu.style.top = `${e.pageY}px`;
      contextMenu.style.left = `${e.pageX}px`;
      contextMenu.style.display = "block";
    });

    window.addEventListener("click", () => {
      contextMenu.style.display = "none";
    });

    // Görev Çubuğu Saati
    function updateClock() {
      const now = new Date();
      let hours = now.getHours();
      let minutes = now.getMinutes();
      const ampm = hours >= 12 ? 'PM' : 'AM';
      hours = hours % 12;
      hours = hours ? hours : 12;
      minutes = minutes < 10 ? '0' + minutes : minutes;
      document.getElementById('clock').innerText = hours + ':' + minutes + ' ' + ampm;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // İlk Yüklemede Windows Butonlarını Getir
    renderApps();
  </script>
</body>
</html>

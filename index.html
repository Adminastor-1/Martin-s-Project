<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retro İndirme Merkezi - Windows 95</title>
  <!-- Windows 98/95 CSS Framework -->
  <link rel="stylesheet" href="https://unpkg.com/98.css">
  <style>
    /* Windows 95 İmleç Stili */
    * {
      cursor: url('https://cur.cursors-4u.net/computers/com-1/com032.cur'), auto !important;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #008080; /* Win95 Klasik Masaüstü Yeşili */
      font-family: "Pixelated MS Sans Serif", "MS Sans Serif", Tahoma, sans-serif;
      overflow: hidden;
      user-select: none;
    }

    /* Ana Ekran Düzeni */
    .desktop {
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 4px;
      padding-bottom: 38px; /* Taskbar boşluğu */
    }

    /* Tam Ekran Pencere */
    .main-window {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .window-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 8px;
      margin: 0;
      overflow: hidden;
    }

    /* Sol ve Sağ Panelleri Ayıran Esnek Düzen */
    .app-layout {
      display: flex;
      flex: 1;
      gap: 10px;
      height: 100%;
      margin-top: 8px;
      overflow: hidden;
    }

    /* Sol Panel (Kategoriler) */
    .sidebar {
      width: 230px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 8px;
      background: #c0c0c0;
      overflow-y: auto;
    }

    .category-btn {
      width: 100%;
      padding: 10px;
      text-align: left;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      white-space: nowrap;
    }

    .category-btn.active {
      font-weight: bold;
      background-color: #000080;
      color: white;
    }

    /* Sağ Panel (İçerik/Butonlar) */
    .content-area {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      background: #c0c0c0;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 12px;
      margin-top: 10px;
    }

    .app-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px;
      height: 85px;
      text-align: center;
      font-size: 11px;
    }

    .app-btn span {
      margin-top: 6px;
    }

    /* Özel Sağ Tık Menüsü */
    #custom-context-menu {
      display: none;
      position: absolute;
      z-index: 10000;
      width: 160px;
    }

    #custom-context-menu ul {
      list-style: none;
      margin: 0;
      padding: 2px;
    }

    #custom-context-menu li {
      padding: 4px 10px;
      font-size: 12px;
    }

    #custom-context-menu li:hover {
      background-color: #000080;
      color: white;
    }

    /* Modal / Kurulum Penceresi */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      z-index: 9000;
      justify-content: center;
      align-items: center;
    }

    .modal-window {
      width: 450px;
      max-width: 90%;
    }

    /* Alt Görev Çubuğu (Taskbar) */
    .taskbar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 35px;
      background: #c0c0c0;
      border-top: 2px solid #ffffff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 2px 5px;
      z-index: 8000;
    }

    .start-btn {
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 5px;
      height: 28px;
    }

    .time-box {
      border: 2px inset #ffffff;
      padding: 2px 8px;
      font-size: 11px;
      background: #c0c0c0;
    }
  </style>
</head>
<body>

  <!-- Başlangıç Sesi -->
  <audio id="win95-sound" src="https://www.myinstants.com/media/sounds/windows-95-startup.mp3" preload="auto"></audio>

  <div class="desktop">
    <!-- Tam Ekran Windows Penceresi -->
    <div class="window main-window">
      <div class="title-bar">
        <div class="title-bar-text">💾 Retro_Indirme_Merkezi.exe - [Tam Ekran]</div>
        <div class="title-bar-controls">
          <button aria-label="Minimize"></button>
          <button aria-label="Maximize"></button>
          <button aria-label="Close"></button>
        </div>
      </div>
      
      <div class="window-body">
        <p style="margin: 2px 0 6px 0;">Sol menüden bir kategori seçin ve yükleme rehberi için yazılıma tıklayın.</p>
        
        <div class="app-layout">
          <!-- Sol Kısım: Genişletilmiş Kategoriler -->
          <fieldset class="sidebar">
            <legend>Kategoriler</legend>
            <button class="category-btn active" id="btn-win" onclick="showCategory('win')">
              💻 Windows (10)
            </button>
            <button class="category-btn" id="btn-linux" onclick="showCategory('linux')">
              🐧 Linux (10)
            </button>
            <button class="category-btn" id="btn-dos" onclick="showCategory('dos')">
              👾 DOS Oyunları (10)
            </button>
            <button class="category-btn" id="btn-tools" onclick="showCategory('tools')">
              🛠️ Sistem Araçları (10)
            </button>
            <button class="category-btn" id="btn-drivers" onclick="showCategory('drivers')">
              📁 Sürücüler (10)
            </button>
          </fieldset>

          <!-- Sağ Kısım: İndirme Butonları -->
          <fieldset class="content-area">
            <legend id="section-title">💻 Windows Yazılımları</legend>
            <div class="grid-container" id="app-grid"></div>
          </fieldset>
        </div>
      </div>
    </div>
  </div>

  <!-- Kurulum Açıklama Penceresi (Modal) -->
  <div class="modal-overlay" id="info-modal">
    <div class="window modal-window">
      <div class="title-bar">
        <div class="title-bar-text" id="modal-title">Program Detayı</div>
        <div class="title-bar-controls">
          <button aria-label="Close" onclick="closeModal()"></button>
        </div>
      </div>
      <div class="window-body">
        <p id="modal-desc" style="white-space: pre-line; line-height: 1.4;">Kurulum bilgisi bekleniyor...</p>
        <div class="field-row" style="justify-content: flex-end; margin-top: 20px; gap: 8px;">
          <button onclick="alert('İndirme Başlatılıyor...')">💾 İndirmeyi Başlat</button>
          <button onclick="closeModal()">Kapat</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Win95 Sağ Tık Menüsü -->
  <div id="custom-context-menu" class="window">
    <div class="window-body" style="padding: 2px;">
      <ul>
        <li onclick="alert('Sistem: Windows 95 OSR2\nRAM: 32 MB\nMod: Tam Ekran')">🖥️ Özellikler</li>
        <li onclick="location.reload()">🔄 Yenile</li>
        <hr>
        <li onclick="alert('Tüm indirmeler virüs taramasından geçirilmiştir.')">🛡️ Güvenlik Bilgisi</li>
        <li onclick="alert('Retro Download Hub v3.0')">ℹ️ Hakkında</li>
      </ul>
    </div>
  </div>

  <!-- Taskbar -->
  <div class="taskbar">
    <button class="start-btn" onclick="alert('Windows 95 Başlat Menüsü')">
      <b>Başlat</b>
    </button>
    <div class="time-box" id="clock">12:00 PM</div>
  </div>

  <script>
    // 1. Windows Programları Listesi
    const winApps = [
      { name: "WinRAR 3.0", setup: "1. setup.exe dosyasını indirin.\n2. Çift tıklayıp varsayılan dizine kurun." },
      { name: "Winamp 2.91", setup: "1. Kurulumu tamamlayın.\n2. MP3 listenizi sürükleyip oynatın." },
      { name: "mIRC v6.0", setup: "1. Programı kurun.\n2. Bir rumuz belirleyip IRC sunucusuna bağlanın." },
      { name: "Nero Burning ROM", setup: "1. Kurulumu yapın.\n2. Veri CD'si seçeneğini tıklayıp yazdırın." },
      { name: "CCleaner Classic", setup: "1. Yükleyin ve 'Analiz Et' butonuna basarak temizlik yapın." },
      { name: "Daemon Tools 3.47", setup: "1. Yeniden başlatma sonrası sanal sürücüye .ISO imajı bağlayın." },
      { name: "MSN Messenger 4.7", setup: "1. Yükleme sonrası kullanıcı bilgilerinizle giriş yapın." },
      { name: "K-Lite Codec Pack", setup: "1. Kurulumu varsayılan modda tamamlayın." },
      { name: "Total Commander", setup: "1. Çift panelli gezgin ile dosyaları yönetin." },
      { name: "BS.Player Old", setup: "1. İndirip kurun, video ve altyazıları sorunsuz oynatın." }
    ];

    // 2. Linux Programları Listesi
    const linuxApps = [
      { name: "XMMS Player", setup: "1. Terminale 'sudo apt install xmms' yazın veya tgz'den derleyin." },
      { name: "XChat IRC", setup: "1. 'sudo dpkg -i xchat.deb' komutuyla yükleyin." },
      { name: "GIMP 1.2 Retro", setup: "1. Paket yöneticisinden indirin, terminalden 'gimp' yazarak açın." },
      { name: "Wine 1.0", setup: "1. 'sudo apt install wine' komutunu çalıştırın." },
      { name: "Midnight Commander", setup: "1. 'sudo apt install mc' yazıp terminalde 'mc' çalıştırın." },
      { name: "MPlayer CLI", setup: "1. Terminale 'mplayer video.avi' yazarak çalıştırın." },
      { name: "Fluxbox Mgr", setup: "1. Hafif pencere yöneticisini yükleyip oturum tipini değiştirin." },
      { name: "HTOP Sys Monitor", setup: "1. 'sudo apt install htop' komutu ile konsoldan kaynakları izleyin." },
      { name: "Xterm Retro", setup: "1. Klasik terminal istemcisini yükleyin." },
      { name: "Apache Web Server", setup: "1. 'sudo systemctl start apache2' komutuyla sunucuyu başlatın." }
    ];

    // 3. DOS Oyunları Listesi
    const dosApps = [
      { name: "DOOM (1993)", setup: "1. ZIP dosyasını çıkarın.\n2. DOSBox ile 'DOOM.EXE' dosyasını çalıştırın." },
      { name: "Duke Nukem 3D", setup: "1. Dosyaları D:\\GAMES\\DUKE3D klasörüne atın.\n2. SETUP.EXE ile ses kartını yapılandırın." },
      { name: "Prince of Persia", setup: "1. PRINCE.EXE dosyasını çalıştırın.\n2. Yön tuşları ile oynayın." },
      { name: "Quake I", setup: "1. GLQUAKE veya QUAKE.EXE çalıştırın." },
      { name: "Wolfenstein 3D", setup: "1. WOLF3D.EXE dosyasını açın." },
      { name: "Need For Speed 1", setup: "1. NFS.BAT dosyasından oyuna girin." },
      { name: "GTA 1 (DOS)", setup: "1. GTA.EXE çalıştırıp çözünürlük seçin." },
      { name: "Mortal Kombat II", setup: "1. MK2.EXE çalıştırıp klavye tuşlarını ayarlayın." },
      { name: "Command & Conquer", setup: "1. C&C DOS sürümünü yükleyip C&C.EXE başlatın." },
      { name: "SimCity 2000", setup: "1. SC2000.EXE ile şehri yönetmeye başlayın." }
    ];

    // 4. Sistem Araçları Listesi
    const toolsApps = [
      { name: "Defrag (Disk Birleştirici)", setup: "1. Başlat > Programlar > Donatılar > Sistem Araçları yolunu izleyin." },
      { name: "Regedit (Kayıt Defteri)", setup: "1. Çalıştır penceresine 'regedit' yazın." },
      { name: "ScanDisk", setup: "1. Diskteki bozuk sektörleri taratmak için 'Standart' modda başlatın." },
      { name: "MSConfig Classic", setup: "1. Başlangıçta çalışan programları kapatmak için kullanın." },
      { name: "DirectX 6.1 Diagnostic", setup: "1. Çalıştır'a 'dxdiag' yazıp ekran kartı testini yapın." },
      { name: "AIDA16 / EVEREST", setup: "1. Donanım özetini görüntülemek için .exe'yi açın." },
      { name: "Partition Magic 4.0", setup: "1. Sabit diski format atmadan bölümlere ayırmak için çalıştırın." },
      { name: "Ghost 5.0 (Symantec)", setup: "1. Diskin tam imajını yedeklemek için DOS ortamında çalıştırın." },
      { name: "WinZip 6.3", setup: "1. Arşiv dosyaları oluşturmak için kurun." },
      { name: "MemMaker DOS", setup: "1. Konvansiyonel RAM hafızasını optimize etmek için 'MEMMAKER' yazın." }
    ];

    // 5. Sürücüler (Drivers) Listesi
    const driversApps = [
      { name: "Sound Blaster 16/32 Driver", setup: "1. INSTALL.EXE çalıştırın ve SB16 I/O portunu 220, IRQ 7 seçin." },
      { name: "S3 Trio64V+ VGA Driver", setup: "1. Aygıt Yöneticisinden Ekran Bağdaştırıcısını güncelleştir seçeneğini kullanın." },
      { name: "3Com EtherLink III LAN", setup: "1. Ağ kartı sürücüsünü .INF dosyası ile yükleyin." },
      { name: "USRobotics 56K Modem", setup: "1. COM portunu belirleyip AT komut setini test edin." },
      { name: "Voodoo 3DFX Glide Driver", setup: "1. 3D Hızlandırıcı kartınız için .exe setup'ını çalıştırın." },
      { name: "Realtek RTL8139 Driver", setup: "1. Windows 95 Ağ ayarlarından diske basıp yükleyin." },
      { name: "Intel Chipset INF Update", setup: "1. Anakart çip tanımını yapmak için setup'ı başlatın." },
      { name: "Yamaha YMF724 Sound Driver", setup: "1. YMF724.EXE çalıştırıp MIDI sentezleyiciyi aktif edin." },
      { name: "Logitech PS/2 Mouse Driver", setup: "1. Tekerlekli fare işlevleri için yazılımı kurun." },
      { name: "MS-DOS CD-ROM Driver (OAK)", setup: "1. CONFIG.SYS dosyasına 'DEVICE=OAKCDROM.SYS /D:MSCD001' ekleyin." }
    ];

    let currentCategory = 'win';

    // Ekranı Güncelleme Fonksiyonu
    function renderApps() {
      const grid = document.getElementById("app-grid");
      const title = document.getElementById("section-title");
      grid.innerHTML = "";

      let apps = [];
      let icon = "💽";
      let titleText = "";

      switch(currentCategory) {
        case 'win':
          apps = winApps;
          icon = "💽";
          titleText = "💻 Windows Yazılımları (10 Program)";
          break;
        case 'linux':
          apps = linuxApps;
          icon = "🐧";
          titleText = "🐧 Linux Yazılımları (10 Program)";
          break;
        case 'dos':
          apps = dosApps;
          icon = "👾";
          titleText = "👾 DOS Oyunları (10 Oyun)";
          break;
        case 'tools':
          apps = toolsApps;
          icon = "🛠️";
          titleText = "🛠️ Sistem Araçları (10 Araç)";
          break;
        case 'drivers':
          apps = driversApps;
          icon = "📁";
          titleText = "📁 Sürücüler & Drivers (10 Sürücü)";
          break;
      }

      title.innerText = titleText;

      apps.forEach(app => {
        const btn = document.createElement("button");
        btn.className = "app-btn";
        btn.innerHTML = `<span style="font-size:20px;">${icon}</span><span>${app.name}</span>`;
        btn.onclick = () => openModal(app.name, app.setup);
        grid.appendChild(btn);
      });
    }

    // Sol Menü Tıklama Değişimi
    function showCategory(cat) {
      currentCategory = cat;

      const categories = ['win', 'linux', 'dos', 'tools', 'drivers'];
      categories.forEach(c => {
        const btn = document.getElementById(`btn-${c}`);
        if(btn) btn.classList.toggle("active", c === cat);
      });

      renderApps();
    }

    // Modal Aç/Kapat
    function openModal(title, setupInfo) {
      document.getElementById("modal-title").innerText = title + " - Rehber / Kurulum";
      document.getElementById("modal-desc").innerText = setupInfo;
      document.getElementById("info-modal").style.display = "flex";
    }

    function closeModal() {
      document.getElementById("info-modal").style.display = "none";
    }

    // Windows 95 Açılış Sesi
    function playWin95Sound() {
      const audio = document.getElementById("win95-sound");
      if (audio) {
        audio.play().catch(() => {});
      }
      window.removeEventListener("click", playWin95Sound);
    }
    window.addEventListener("click", playWin95Sound);

    // Windows 95 Özel Sağ Tık Menüsü
    const contextMenu = document.getElementById("custom-context-menu");

    window.addEventListener("contextmenu", (e) => {
      e.preventDefault();
      contextMenu.style.top = `${e.pageY}px`;
      contextMenu.style.left = `${e.pageX}px`;
      contextMenu.style.display = "block";
    });

    window.addEventListener("click", () => {
      contextMenu.style.display = "none";
    });

    // Görev Çubuğu Saati
    function updateClock() {
      const now = new Date();
      let hours = now.getHours();
      let minutes = now.getMinutes();
      const ampm = hours >= 12 ? 'PM' : 'AM';
      hours = hours % 12;
      hours = hours ? hours : 12;
      minutes = minutes < 10 ? '0' + minutes : minutes;
      document.getElementById('clock').innerText = hours + ':' + minutes + ' ' + ampm;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // İlk Yüklemede Windows Kategorisini Getir
    renderApps();
  </script>
</body>
</html>
